<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juego de la Actualidad</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05050a;
        overflow: hidden;
      }
      #game {
        width: 100vw;
        height: 100vh;
      }
      .error {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 16px;
        font-family: system-ui, -apple-system, sans-serif;
        color: #ffffff;
      }
      .error h1 {
        margin: 0;
        color: #ff5555;
        letter-spacing: 3px;
        font-size: 28px;
      }
      .error pre {
        margin: 0;
        max-width: 80%;
        white-space: pre-wrap;
        background: #1c1c28;
        padding: 24px 32px;
        border-radius: 8px;
        font-size: 15px;
        line-height: 1.5;
      }
      /* Portrait en teléfono: los juegos son landscape. Desde la web no se puede
         forzar la rotación — se pide girar y en Android el JUGAR lockea landscape. */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #05050a;
        color: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      #rotate .phone {
        font-size: 72px;
        line-height: 1;
        margin-bottom: 16px;
        animation: girar 1.6s ease-in-out infinite alternate;
      }
      #rotate h1 {
        margin: 0 0 10px;
        letter-spacing: 3px;
        font-size: 26px;
      }
      #rotate p {
        margin: 0;
        color: #9aa0b5;
        line-height: 1.5;
      }
      @keyframes girar {
        from { transform: rotate(0deg); }
        to { transform: rotate(90deg); }
      }
      @media (orientation: portrait) and (max-width: 480px),
        (orientation: portrait) and (pointer: coarse) and (max-width: 700px) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">
      <div>
        <div class="phone">📱</div>
        <h1>GIRÁ EL TELÉFONO</h1>
        <p>Este juego se juega de costado. Si no gira, fijate el candado de rotación.</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
