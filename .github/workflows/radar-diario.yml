# Jornada diaria hospedada — el corte de la Etapa 2 (decisión 2026-10-15).
#
# Dos crons conviven y se protegen entre sí con la idempotencia de
# scripts/jornada.mjs (si ya existe evento de la fecha, es un no-op):
#
#  - 9:00 Argentina: la automatización de ZCode, en la máquina local
#    (modo sin key: la sesión hace de LLM con los mismos contratos). Si la
#    máquina estaba apagada a esa hora, esa corrida se pierde.
#  - 10:30 Argentina (este workflow): corrida hospedada, no depende de nadie.
#    Con el secret LLM_API_KEY corre `npm run jornada` completo (headless con
#    key). Sin secret degrada a `npm run radar` (solo candidatos crudos).
#    Sale una hora después de la de ZCode a propósito: si la de las 9:00 ya
#    publicó, acá encuentra la jornada producida y no hace nada.
#
# El push a main deploya (Cloudflare Workers Builds). Des-publicar = un commit.

name: radar-diario

on:
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha YYYY-MM-DD (vacío = hoy, UTC)'
        required: false
  schedule:
    - cron: '30 13 * * *' # 10:30 Argentina (UTC-3), 1 h después del cron de ZCode

permissions:
  contents: write

concurrency:
  group: radar-diario
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # jornada.mjs commitea por adentro: la identidad tiene que estar antes.
      - name: Identidad de git
        run: |
          git config user.name "radar-bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Jornada (o radar si no hay key)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # La key del secret es del Coding Plan de Z.ai: su cuota solo vale en
          # el endpoint coding (decisión 16/10; pay-per-token queda de recambio).
          LLM_BASE_URL: https://api.z.ai/api/coding/paas/v4
          SITE_URL: https://argentilandia.dami-fontenla.workers.dev
          FECHA_INPUT: ${{ github.event.inputs.fecha }}
        run: |
          FECHA="${FECHA_INPUT:-$(date -u +%F)}"
          if [ -n "$LLM_API_KEY" ]; then
            npm run jornada -- "$FECHA"
          else
            echo "Sin el secret LLM_API_KEY: modo degradado, solo radar."
            npm run radar -- "$FECHA"
          fi
      # Solo aporta algo en el modo degradado (la jornada ya commitea lo suyo);
      # si la jornada corrió, no encuentra nada para commitear.
      - name: Commit de candidatos
        run: |
          git add content/radar/
          if git diff --cached --quiet; then
            echo "Nada para commitear"
          else
            git commit -m "radar-${GITHUB_EVENT_INPUTS_FECHA:-$(date -u +%F)}"
            git push
          fi
